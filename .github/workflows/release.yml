name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.15.0
          # No cache: a tag build must not restore a cache a branch build wrote.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          test -f dist/THIRD-PARTY-NOTICES.txt
          mkdir -p assets/
          cp -R dist typst
          cp LICENSE typst/
          zip -r "assets/typst-${VERSION}.zip" typst/
          rm -rf typst/

      - name: Generate checksums
        run: |
          cd assets/
          md5sum * > md5sum.txt
          sha256sum * > sha256sum.txt

      - name: Publish release # zizmor: ignore[superfluous-actions] the publish path only runs on a real release, CI cannot exercise a rewrite
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: assets/*
          generate_release_notes: true
